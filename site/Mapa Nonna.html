<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa — Nonna Giordani</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#EFEAE2;font-family:'Josefin Sans',sans-serif}
#map{position:absolute;inset:0}
.leaflet-container{background:#EFEAE2}
.hud{position:absolute;right:12px;top:12px;z-index:500;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:24px;background:#161412;color:#F6F3EE;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hud img{width:34px;height:34px;object-fit:contain;display:block}
.hud small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.hud b{font-size:15px;color:#E3A566;min-width:64px;font-variant-numeric:tabular-nums}
.bread{width:18px;height:9px;border-radius:9px;background:linear-gradient(180deg,#EDB676,#C9803F);box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 -1px 0 rgba(0,0,0,.15);position:relative;transition:transform .25s,opacity .25s}
.bread::before,.bread::after{content:"";position:absolute;top:2px;width:1.5px;height:5px;background:#8A4E25;border-radius:1px;transform:rotate(25deg)}
.bread::before{left:5px}.bread::after{left:10px}
.bread.got{transform:scale(1.8) translateY(-8px);opacity:0}
.rider{position:relative;width:112px;height:112px;pointer-events:none}
.rider .img{position:absolute;left:0;top:0;width:92px;height:102px;z-index:2}
.wheel{position:absolute;width:24px;height:24px;border-radius:50%;background:#1d1b1a;box-shadow:0 3px 4px rgba(0,0,0,.35);z-index:1}
.wheel::before{content:"";position:absolute;inset:5px;border-radius:50%;background:conic-gradient(#bfc3c6 0 10%,#6d7275 0 25%,#bfc3c6 0 35%,#6d7275 0 50%,#bfc3c6 0 60%,#6d7275 0 75%,#bfc3c6 0 85%,#6d7275 0);animation:spin .5s linear infinite}
.wheel::after{content:"";position:absolute;inset:10px;border-radius:50%;background:#e8e8e8}
.wheel.f{left:5px;top:84px}.wheel.r{left:44px;top:85px}
.rider.stop .wheel::before{animation:none}
@keyframes spin{to{transform:rotate(-360deg)}}
.rack{position:absolute;left:62px;top:74px;width:30px;height:3px;background:#5b5f62;border-radius:2px;z-index:3}
.basket{position:absolute;left:62px;top:56px;width:34px;height:20px;z-index:4;border-radius:3px 3px 9px 9px;border:2px solid #6b3f1d;box-sizing:border-box;background:repeating-linear-gradient(45deg,#b07a42 0 3px,#8a5a2b 3px 6px),#9a6632;background-blend-mode:multiply;box-shadow:inset 0 3px 0 rgba(0,0,0,.18)}
.basket::before{content:"";position:absolute;left:-3px;right:-3px;top:-4px;height:5px;border-radius:3px;background:#7a4a22}
.loaves{position:absolute;left:62px;top:52px;width:34px;height:24px;z-index:3}
.loaf{position:absolute;bottom:4px;width:7px;height:36px;border-radius:5px;background:linear-gradient(90deg,#f0bd80,#c9803f 70%,#a8652c);transform-origin:bottom center;transform:rotate(var(--r)) scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.loaf::before{content:"";position:absolute;left:2px;top:5px;width:3px;height:14px;background:repeating-linear-gradient(170deg,transparent 0 3px,#8a4e25 3px 4px)}
.loaf.on{transform:rotate(var(--r)) scale(1)}
.rider .flip{position:absolute;inset:0;transition:transform .2s}
.rider .bob{position:absolute;inset:0;animation:bob .32s ease-in-out infinite alternate}
.rider .img{object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.rider .count{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#A85A24;color:#fff;border:2px solid #fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.rider.stop .bob{animation:none}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-3px) rotate(2deg)}}
.store{position:relative;width:64px;height:64px}
.store img{width:64px;height:64px;border-radius:50%;display:block;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);position:relative}
.store::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #A85A24;animation:pulse 1.6s ease-out infinite}
.store .tag{position:absolute;left:50%;top:72px;transform:translateX(-50%);white-space:nowrap;background:#161412;color:#F6F3EE;padding:6px 12px;border-radius:14px;font-size:11px;font-weight:700;letter-spacing:.12em}
@keyframes pulse{from{transform:scale(1);opacity:1}to{transform:scale(1.9);opacity:0}}
.start{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #161412;box-sizing:border-box}
.done{position:absolute;left:50%;bottom:18px;transform:translate(-50%,20px);z-index:500;background:#F6F3EE;color:#161412;padding:10px 18px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.done.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.rider .bob,.store::before{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="hud"><img src="assets/nonna-lambreta-v2.png" alt=""><small>Cesto</small><b id="count">00 pães</b></div>
<div class="done" id="done">A Nonna chegou · Av. A, 86</div>
<script>
// Ajuste aqui se quiser fixar a posição exata da loja: [lat, lng]
const STORE_OVERRIDE = null;
const FALLBACK = [-22.4179651, -44.2955901];
const ADDRESS_QUERIES = [
  'Avenida Agnelio dos Santos, Nova Colônia, Porto Real, RJ, Brasil',
  'Avenida Agnélio dos Santos, Porto Real, RJ',
  'Nova Colônia, Porto Real, RJ, Brasil'
];

const map = L.map('map', { zoomControl: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false, dragging: false, attributionControl: true }).setView(FALLBACK, 15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);

const countEl = document.getElementById('count'), doneEl = document.getElementById('done');
const setCount = n => { countEl.textContent = String(n).padStart(2, '0') + (n === 1 ? ' pão' : ' pães'); if (riderCount) riderCount.textContent = n; const v = Math.round(n / totalBreads * loafEls.length); loafEls.forEach((l, i) => l.classList.toggle('on', i < v)); };
let riderCount = null, loafEls = [], totalBreads = 1;
const LOAF_SLOTS = [[3,-18],[10,-6],[17,8],[24,20],[6,-10],[14,2],[21,14],[8,-24],[18,-2],[26,26]];
const LOAVES = LOAF_SLOTS.map(([x,r]) => '<i class="loaf" style="left:'+x+'px;--r:'+r+'deg"></i>').join('');

async function geocode() {
  if (STORE_OVERRIDE) return STORE_OVERRIDE;
  for (const q of ADDRESS_QUERIES) {
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=' + encodeURIComponent(q));
      const j = await r.json();
      if (j[0]) return [parseFloat(j[0].lat), parseFloat(j[0].lon)];
    } catch (e) {}
  }
  return FALLBACK;
}

async function route(a, b) {
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
    const j = await r.json();
    if (j.routes && j.routes[0]) return j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
  } catch (e) {}
  return [a, b];
}

(async () => {
  const store = await geocode();
  const start = [store[0] + 0.0058, store[1] - 0.0072];
  const path = await route(start, store);
  path.push(store);

  const ll = path.map(p => L.latLng(p));
  const cum = [0];
  for (let i = 1; i < ll.length; i++) cum.push(cum[i - 1] + ll[i - 1].distanceTo(ll[i]));
  const total = cum[cum.length - 1];
  const at = d => {
    d = Math.max(0, Math.min(total, d));
    let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
    const seg = cum[i] - cum[i - 1] || 1, t = (d - cum[i - 1]) / seg;
    const a = ll[i - 1], b = ll[i];
    return { lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t, dir: Math.sign(b.lng - a.lng) };
  };

  L.polyline(path, { color: '#161412', weight: 9, opacity: .18, lineCap: 'round' }).addTo(map);
  L.polyline(path, { color: '#A85A24', weight: 4, opacity: .9, dashArray: '2 10', lineCap: 'round' }).addTo(map);

  const breads = [];
  const step = Math.max(45, total / 22);
  for (let d = step; d < total - step * 0.6; d += step) {
    const p = at(d);
    const m = L.marker([p.lat, p.lng], { interactive: false, keyboard: false, icon: L.divIcon({ className: '', html: '<div class="bread"></div>', iconSize: [18, 9], iconAnchor: [9, 4.5] }) }).addTo(map);
    breads.push({ d, m, got: false });
  }

  L.marker(start, { interactive: false, icon: L.divIcon({ className: '', html: '<div class="start"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(map);
  L.marker(store, { icon: L.divIcon({ className: '', html: '<div class="store"><img src="assets/logo-nonna.png" alt="Nonna Giordani"><div class="tag">NONNA GIORDANI · AV. A, 86</div></div>', iconSize: [64, 64], iconAnchor: [32, 32] }) })
    .addTo(map).bindPopup('<b>Nonna Giordani</b><br>Avenida A, nº 86 · Nova Colônia<br>Porto Real · RJ · 27570-000');

  const rider = L.marker(start, { interactive: false, zIndexOffset: 1000, icon: L.divIcon({ className: '', html: '<div class="rider"><div class="flip"><div class="bob"><div class="wheel f"></div><div class="wheel r"></div><div class="rack"></div><div class="loaves">'+LOAVES+'</div><img class="img" src="assets/nonna-lambreta-v2.png" alt=""><div class="basket"></div></div></div><div class="count">0</div></div>', iconSize: [112, 112], iconAnchor: [48, 104] }) }).addTo(map);
  const el = () => rider.getElement();
  riderCount = el().querySelector('.count');
  const flip = el().querySelector('.flip');
  loafEls = [...el().querySelectorAll('.loaf')]; totalBreads = breads.length;

  const bounds = L.latLngBounds(path);
  const refit = () => { map.invalidateSize(); map.fitBounds(bounds.pad(0.12), { animate: false }); };
  refit(); setTimeout(refit, 300);
  addEventListener('resize', refit);

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duration = 16, hold = 3;
  const speed = total / duration;
  let d = 0, last = 0, count = 0, holdT = 0, face = 1, visible = true;

  const reset = () => { d = 0; count = 0; holdT = 0; breads.forEach(b => { b.got = false; b.m.getElement().firstChild.classList.remove('got'); }); setCount(0); doneEl.classList.remove('show'); el().querySelector('.rider').classList.remove('stop'); };

  function frame(ts) {
    requestAnimationFrame(frame);
    const t = ts / 1000, dt = last ? Math.min(0.05, t - last) : 0; last = t;
    if (!visible) return;
    if (d >= total) { holdT += dt; if (holdT > hold) reset(); }
    else { d += speed * dt; if (d >= total) { doneEl.classList.add('show'); el().querySelector('.rider').classList.add('stop'); } }
    for (const b of breads) if (!b.got && d >= b.d) { b.got = true; b.m.getElement().firstChild.classList.add('got'); count++; setCount(count); }
    const p = at(d);
    if (p.dir) face = p.dir;
    flip.style.transform = `scaleX(${face > 0 ? -1 : 1})`;
    rider.setLatLng([p.lat, p.lng]);
  }

  if (reduce) { d = total; breads.forEach(b => { b.got = true; b.m.getElement().firstChild.classList.add('got'); }); setCount(breads.length); rider.setLatLng(store); doneEl.classList.add('show'); }
  else requestAnimationFrame(frame);

  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(document.getElementById('map'));
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = 0; });
})();
</script>
</body>
</html>
