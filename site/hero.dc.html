<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Josefin+Sans:wght@400;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>body{margin:0;background:#0E0C0A}a{color:#F1EAE0}a:hover{color:#D9B98C}@keyframes hbUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes hbZoom{from{opacity:0;transform:scale(1.045)}to{opacity:1;transform:scale(1)}}</style>
</helmet>
<section ref="{{ rootRef }}" aria-labelledby="hero-title" style="position:relative;z-index:1;height:clamp(620px,100svh,1000px);overflow:hidden;background:#0E0C0A;font-family:'Mulish',sans-serif;color:#F1EAE0">
  <video ref="{{ videoRef }}" src="assets/video/hero-farinha.mp4" autoplay="" muted="" loop="" playsinline="" preload="auto" aria-hidden="true" style="position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;display:block;animation:hbZoom 2.4s cubic-bezier(.2,.7,.2,1) both"></video>
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:0;pointer-events:none;background:rgba(14,12,10,0.38)"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 46% 42% at 50% 46%,rgba(14,12,10,0.62) 0%,rgba(14,12,10,0.25) 60%,rgba(14,12,10,0) 100%)"></div>
  <canvas ref="{{ fxRef }}" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none"></canvas>

  <div style="position:relative;z-index:3;height:100%;box-sizing:border-box;padding:{{ heroPad }};display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(18px,2.8vh,28px);pointer-events:none">
    <span style="animation:hbUp .9s .2s cubic-bezier(.2,.7,.2,1) both;font-family:'Josefin Sans',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;color:#D9B98C">Nonna Giordani · Pães artesanais</span>
    <h1 id="hero-title" style="margin:0;display:flex;flex-direction:column;align-items:center;font-family:'Cormorant Garamond',serif;font-weight:500;color:#F6F0E6;text-transform:uppercase;animation:hbUp 1.1s .35s cubic-bezier(.2,.7,.2,1) both">
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Pão feito com tempo.</span>
      <span aria-hidden="true" style="display:flex;font-size:clamp(40px,7vw,112px);line-height:.9;letter-spacing:.05em"><sc-for list="{{ tw1 }}" as="c" hint-placeholder-count="9"><span style="position:relative;opacity:{{ c.op }}">{{ c.ch }}<sc-if value="{{ c.caret }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:-.08em;top:.12em;bottom:.08em;width:2px;background:#D9B98C;opacity:1"></span></sc-if></span></sc-for></span>
      <span aria-hidden="true" style="display:flex;font-size:clamp(40px,7vw,112px);line-height:.95;letter-spacing:.05em"><sc-for list="{{ tw2 }}" as="c" hint-placeholder-count="4"><span style="position:relative;opacity:{{ c.op }}">{{ c.ch }}<sc-if value="{{ c.caret }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:-.08em;top:.12em;bottom:.08em;width:2px;background:#D9B98C"></span></sc-if></span></sc-for><em style="display:flex;font-style:italic;font-weight:400;text-transform:none;letter-spacing:0"><sc-for list="{{ tw3 }}" as="c" hint-placeholder-count="6"><span style="position:relative;opacity:{{ c.op }}">{{ c.ch }}<sc-if value="{{ c.caret }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:-.08em;top:.12em;bottom:.08em;width:2px;background:#D9B98C"></span></sc-if></span></sc-for></em></span>
    </h1>
    <p style="margin:0;max-width:390px;font-size:14.5px;line-height:1.75;color:#CFC5B8;text-wrap:pretty;animation:hbUp 1s .6s cubic-bezier(.2,.7,.2,1) both">Receitas de família, fermentação natural e o sabor de uma tradição que atravessa gerações.</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 30px;padding-top:4px;pointer-events:auto;animation:hbUp 1s .85s cubic-bezier(.2,.7,.2,1) both">
      <a href="#cardapio" style="display:inline-flex;align-items:center;gap:12px;height:50px;padding:0 30px;background:#F1EAE0;color:#0E0C0A;text-decoration:none;border-radius:2px;font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;transition:background .3s,gap .3s,color .3s" style-hover="background:#D9B98C;color:#0E0C0A;gap:18px">Pedir agora <span aria-hidden="true">→</span></a>
      <a href="#sobre" style="display:inline-flex;align-items:center;height:50px;text-decoration:none;font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#F1EAE0;border-bottom:1px solid rgba(241,234,224,0.35);transition:border-color .3s,color .3s" style-hover="border-color:#D9B98C;color:#D9B98C">Conheça nossa história</a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  rootRef = React.createRef(); fxRef = React.createRef(); videoRef = React.createRef();
  state = { typed: 99, blink: true };
  componentDidMount() {
    const v = this.videoRef.current;
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const N = 19, t0 = performance.now();
      const tick = now => {
        this.twRaf = requestAnimationFrame(tick);
        let p;
        if (v && v.duration && !isNaN(v.duration) && !v.paused && v.readyState >= 2) p = v.currentTime / v.duration;
        else p = ((now - t0) / 8000) % 1;
        let n;
        if (p < 0.06) n = 0;
        else if (p < 0.5) n = Math.round(N * (p - 0.06) / 0.44);
        else if (p < 0.9) n = N;
        else n = Math.round(N * (1 - (p - 0.9) / 0.08));
        n = Math.max(0, Math.min(N, n));
        const blink = Math.floor(now / 530) % 2 === 0;
        if (n !== this.state.typed || blink !== this.state.blink) this.setState({ typed: n, blink });
      };
      this.twRaf = requestAnimationFrame(tick);
    }
    if (v) { v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      v.addEventListener('ended', () => { v.currentTime = 0; v.play().catch(() => {}); }); const p = v.play(); p && p.catch(() => {});
      if ('IntersectionObserver' in window) { this.vio = new IntersectionObserver(([e]) => { e.isIntersecting ? v.play().catch(() => {}) : v.pause(); }); this.vio.observe(v); } }
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this._rs = () => this.resize(); window.addEventListener('resize', this._rs); this.resize();
    this.visible = true;
    if ('IntersectionObserver' in window) { this.io = new IntersectionObserver(([e]) => { this.visible = e.isIntersecting; }); this.io.observe(this.rootRef.current); }
    const loop = now => { this.raf = requestAnimationFrame(loop); if (this.visible) this.frame(now); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); window.removeEventListener('resize', this._rs); this.io && this.io.disconnect(); this.vio && this.vio.disconnect(); cancelAnimationFrame(this.twRaf); }
  resize() {
    const r = this.rootRef.current, c = this.fxRef.current; if (!r || !c) return;
    const W = r.clientWidth, H = r.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = W * dpr; c.height = H * dpr; this.ctx = c.getContext('2d'); this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const was = this.W < 560; this.W = W; this.H = H; this.forceUpdate();
    this.p = Array.from({ length: Math.round(Math.min(120, W * H / 12000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H, z: Math.random(), ph: Math.random() * 6.28 }));
  }
  frame(now) {
    const { ctx, W, H } = this; if (!ctx) return;
    const dt = Math.min(0.05, this.prev ? (now - this.prev) / 1000 : 0.016); this.prev = now;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#FFF7EA';
    for (const q of this.p) {
      q.ph += dt * (0.25 + q.z * 0.4);
      q.x += Math.cos(q.ph) * (2 + q.z * 4) * dt; q.y += (Math.sin(q.ph * 0.7) * 2 - 1.5 - q.z * 2) * dt;
      if (q.y < -5) q.y = H + 5; if (q.x < -5) q.x = W + 5; if (q.x > W + 5) q.x = -5;
      ctx.globalAlpha = (0.12 + q.z * 0.4) * (0.7 + 0.3 * Math.sin(q.ph * 2));
      ctx.beginPath(); ctx.arc(q.x, q.y, 0.4 + q.z * q.z * 1.8, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  renderVals() {
    const n = this.state.typed, parts = ['Pão feito', 'com ', 'tempo.'];
    let i = 0; const lastIdx = Math.min(n, 19) - 1;
    const [tw1, tw2, tw3] = parts.map(s => [...s].map(ch => { const k = i++; return { ch: ch === ' ' ? '\u00A0' : ch, op: k < n ? 1 : 0, caret: k === lastIdx && n < 19 ? true : (k === 18 && n >= 19 && this.state.blink) }; }));
    if (n === 0) tw1[0].caret = false;
    return { tw1, tw2, tw3, ...this.baseVals() };
  }
  baseVals() { const w = this.W || window.innerWidth; return { heroPad: w < 760 ? '88px 22px 48px' : w < 1100 ? '96px clamp(22px,14vw,200px) 64px clamp(22px,6vw,80px)' : '96px clamp(22px,24vw,440px) clamp(40px,8vh,90px) clamp(22px,6vw,80px)', rootRef: this.rootRef, fxRef: this.fxRef, videoRef: this.videoRef, showSmallBowl: !(this.W && this.W < 560) }; }
}
</script>
</body>
</html>
